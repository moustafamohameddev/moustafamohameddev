<!doctype html>
<meta charset="utf-8">
<title>Reel cover</title>
<link rel="stylesheet" href="brand.css">
<!--
  Reel / Short / TikTok cover, 1080x1920.
  Profile grids crop the center 1080x1440 (y 240–1680): everything that matters sits inside it.
  Query params:
    bg      frame grabbed from the video (path relative to this file, or absolute file:// URL)
    pos     object-position for bg (default "50% 30%")
    surah   surah name without the word سورة, e.g. "الشرح"
    sub     one short line under it, e.g. "الآيات ٥ – ٦"
-->
<style>
  body { --w: 1080px; --h: 1920px; background: var(--night); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dim { position: absolute; inset: 0; background:
      linear-gradient(to bottom, rgba(11,9,7,.35) 0%, rgba(11,9,7,.10) 30%, rgba(11,9,7,.55) 55%, rgba(11,9,7,.94) 82%); }
  .sig { top: 262px; right: 72px; height: 64px; opacity: .9; }
  .title { position: absolute; bottom: 380px; left: 50%; transform: translateX(-50%); width: 900px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .title .label { font-size: 34px; }
  .title .name { font-size: 168px; line-height: 1.35; color: var(--ivory); }
  .title .sub { font-family: var(--font-ui); font-weight: 500; font-size: 34px; color: var(--ivory-muted); }
</style>
<body>
<img class="bg" id="bg" alt="">
<div class="dim"></div>
<img class="sig" src="../assets/signature-ivory.svg" alt="">
<div class="title">
  <p class="label">سورة</p>
  <p class="name quran" id="surah"></p>
  <p class="sub" id="sub"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const bg = document.getElementById('bg');
  if (q.get('bg')) { bg.src = q.get('bg'); bg.style.objectPosition = q.get('pos') || '50% 30%'; } else bg.remove();
  document.getElementById('surah').textContent = q.get('surah') || '';
  const sub = document.getElementById('sub');
  if (q.get('sub')) sub.textContent = q.get('sub'); else sub.remove();
</script>
</body>
