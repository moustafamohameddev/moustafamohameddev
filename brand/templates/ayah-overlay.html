<!doctype html>
<meta charset="utf-8">
<title>Ayah overlay</title>
<link rel="stylesheet" href="brand.css">
<!--
  Transparent overlay for one ayah (or one ayah segment).
  Query params:
    format   vertical (1080x1920, default) | landscape (1920x1080)
    ayah     exact KFGQPC v18 text incl. its ayah number (never typed by hand)
    tr       translation; wrap words to highlight in *stars* (max 2)
    label    surah label, e.g. "سورة الشرح"
    shade    1 (default) draws the bottom gradient, 0 = text only
    sig      1 (default) draws the signature, 0 = hide
    bg       optional background image path, ONLY for previews/mockups
-->
<style>
  body.vertical  { --w: 1080px; --h: 1920px; }
  body.landscape { --w: 1920px; --h: 1080px; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* vertical: safe area x 130–950, block bottom at y = 1440 */
  .vertical .sig  { top: 262px; right: 72px; height: 64px; opacity: .9; }
  .vertical .block { bottom: 480px; width: 820px; gap: 18px; }
  .vertical .ayah { font-size: 62px; line-height: 1.85; }
  .vertical .tr   { font-size: 30px; line-height: 1.38; max-width: 760px; }
  .vertical .label { font-size: 24px; margin-top: 6px; }

  /* landscape: block bottom 96px above frame edge */
  .landscape .sig  { top: 56px; right: 64px; height: 60px; opacity: .9; }
  .landscape .block { bottom: 96px; width: 1400px; gap: 14px; }
  .landscape .ayah { font-size: 66px; line-height: 1.8; }
  .landscape .tr   { font-size: 32px; line-height: 1.35; max-width: 1200px; }
  .landscape .label { font-size: 22px; margin-top: 4px; }
</style>
<body>
<img class="bg" id="bg" hidden alt="">
<div class="shade" id="shade"></div>
<img class="sig" id="sig" src="../assets/signature-ivory.svg" alt="">
<div class="block">
  <p class="ayah quran" id="ayah"></p>
  <p class="tr en" id="tr"></p>
  <p class="label" id="label"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('format') === 'landscape' ? 'landscape' : 'vertical';
  document.getElementById('ayah').textContent = q.get('ayah') || '';
  const tr = document.getElementById('tr');
  // *word* = amber highlight; ˹word˺ (Clear Quran's added words) = muted, brackets dropped
  (q.get('tr') || '').split(/(\*[^*]+\*|˹[^˺]+˺)/).forEach(part => {
    if (!part) return;
    const s = document.createElement('span');
    if (part.startsWith('*')) { s.className = 'hl'; s.textContent = part.slice(1, -1); tr.append(s); }
    else if (part.startsWith('˹')) { s.className = 'add'; s.textContent = part.slice(1, -1); tr.append(s); }
    else tr.append(part);
  });
  if (!q.get('tr')) tr.remove();
  const label = document.getElementById('label');
  if (q.get('label')) label.textContent = q.get('label'); else label.remove();
  if (q.get('shade') === '0') document.getElementById('shade').remove();
  if (q.get('sig') === '0') document.getElementById('sig').remove();
  if (q.get('bg')) { const b = document.getElementById('bg'); b.src = q.get('bg'); b.hidden = false; }
</script>
</body>
