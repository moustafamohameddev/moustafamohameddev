<!doctype html>
<meta charset="utf-8">
<title>YouTube thumbnail</title>
<link rel="stylesheet" href="brand.css">
<!--
  YouTube long-video thumbnail, 1280x720 (upload as JPG < 2 MB).
  Reciter on the left, text column on the right (Arabic reads right to left).
  Bottom-right corner (x > 1120, y > 630) stays empty: YouTube draws the duration badge there.
  Query params:
    bg      frame from the video     pos  object-position (default "20% 35%")
    surah   surah name, e.g. "الكهف"
    sub     short line, e.g. "تلاوة كاملة"
-->
<style>
  body { --w: 1280px; --h: 720px; background: var(--night); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dim { position: absolute; inset: 0; background:
      linear-gradient(to left, rgba(11,9,7,.96) 0%, rgba(11,9,7,.88) 36%, rgba(11,9,7,.15) 70%, rgba(11,9,7,.25) 100%); }
  .col { position: absolute; top: 0; bottom: 0; right: 72px; width: 540px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; }
  .col .label { font-size: 30px; }
  .col .name { font-size: 132px; line-height: 1.35; color: var(--ivory); }
  .col .sub { font-family: var(--font-ui); font-weight: 600; font-size: 34px; color: var(--ivory-muted); }
  .sig { top: 44px; right: 56px; height: 46px; opacity: .9; }
</style>
<body>
<img class="bg" id="bg" alt="">
<div class="dim"></div>
<img class="sig" src="../assets/signature-ivory.svg" alt="">
<div class="col">
  <p class="label">سورة</p>
  <p class="name quran" id="surah"></p>
  <p class="sub" id="sub"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const bg = document.getElementById('bg');
  if (q.get('bg')) { bg.src = q.get('bg'); bg.style.objectPosition = q.get('pos') || '20% 35%'; } else bg.remove();
  document.getElementById('surah').textContent = q.get('surah') || '';
  const sub = document.getElementById('sub');
  if (q.get('sub')) sub.textContent = q.get('sub'); else sub.remove();
</script>
</body>
